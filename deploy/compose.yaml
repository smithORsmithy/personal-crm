# Production on the server: the app and its own database.
# Run only through deploy.sh / seed.sh, they pass the image and the .env file:
#   docker compose -p prod -f /srv/crm/deploy/compose.yaml --env-file /srv/crm/.env ...

name: prod

x-db-settings: &db-settings
  POSTGRES_HOST: db
  POSTGRES_USER: crm
  POSTGRES_DB: personal_crm
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /srv/crm/.env}

# Settings of sign-in, for the app. Required on purpose: Docker Compose
# checks them on every command, so without them deploy.sh stops at its first
# step, before the backup and the migrations, and the old version keeps
# running. The address of the site and the sender are not secrets.
x-app-settings: &app-settings
  <<: *db-settings
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in /srv/crm/.env}
  BETTER_AUTH_URL: https://app.linkbook.site
  SMTP_URL: ${SMTP_URL:?set SMTP_URL in /srv/crm/.env}
  MAIL_FROM: '"Личная CRM" <noreply@mail.crm.linkbook.site>'

services:
  db:
    # Same image as in local development
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: personal_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /srv/crm/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    # No ports: only the app container talks to the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d personal_crm"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-off container from the new image: applies migrations and exits.
  # Not started by "up", only by "run".
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    profiles: ["tools"]
    command: ["node", "scripts/migrate.cjs"]
    environment:
      <<: *db-settings
      # Migration 0006 hands the contacts and groups that exist before
      # sign-in to the user with this email; the test data goes to him too
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in /srv/crm/.env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    restart: unless-stopped
    environment: *app-settings
    ports:
      # Only on this server; nginx serves it to the outside
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
