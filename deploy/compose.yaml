# The app and its own database on the server. One file for production and
# the test stand: the project name (-p prod / -p staging) keeps their
# containers and database volumes apart.
# Run only through the scripts in this folder: use_environment in common.sh
# sets the variables below that are not in .env, and the scripts pass the
# image, the project and the .env file of the environment:
#   docker compose -p <prod|staging> -f /srv/crm/deploy/compose.yaml --env-file <its .env> ...

x-db-settings: &db-settings
  POSTGRES_HOST: db
  POSTGRES_USER: crm
  POSTGRES_DB: personal_crm
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env of the environment}

# Settings of sign-in, for the app. Required on purpose: Docker Compose
# checks them on every command, so without them deploy.sh stops at its first
# step, before the backup and the migrations, and the old version keeps
# running. The address of the site and the sender are not secrets: they
# come from common.sh. The address is the one of this environment, so the
# link in a sign-in email leads back to where the sign-in was asked for.
x-app-settings: &app-settings
  <<: *db-settings
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in the .env of the environment}
  BETTER_AUTH_URL: ${APP_URL:?APP_URL is set by common.sh}
  SMTP_URL: ${SMTP_URL:?set SMTP_URL in the .env of the environment}
  MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is set by common.sh}

# Container logs go to the server's journal (journald): they outlive the
# container, so a deploy or a rollback does not wipe them, and the system
# limits the journal's size. Each line is tagged with the container name:
#   journalctl -t prod-app-1
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  db:
    # Same image as in local development
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: personal_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env of the environment}
    # 0 = no limit (production)
    mem_limit: ${DB_MEMORY_LIMIT:?DB_MEMORY_LIMIT is set by common.sh}
    volumes:
      - pgdata:/var/lib/postgresql
    # No ports: only the app container talks to the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d personal_crm"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-off container from the new image: applies migrations and exits.
  # Not started by "up", only by "run".
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    profiles: ["tools"]
    logging: *logging
    command: ["node", "scripts/migrate.cjs"]
    environment:
      <<: *db-settings
      # Migration 0006 hands the contacts and groups that exist before
      # sign-in to the user with this email; the test data goes to him too
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in the .env of the environment}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    restart: unless-stopped
    environment: *app-settings
    logging: *logging
    # 0 = no limit (production)
    mem_limit: ${APP_MEMORY_LIMIT:?APP_MEMORY_LIMIT is set by common.sh}
    ports:
      # Only on this server; nginx serves it to the outside
      - "127.0.0.1:${APP_PORT:?APP_PORT is set by common.sh}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
