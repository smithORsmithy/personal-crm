name: Deploy

on:
  push:
    branches: [main]
  # Manual run. With image_tag it deploys an already built version instead
  # of building a new one: that is the manual rollback.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA of an existing image (leave empty to build main)"
        required: false
        default: ""

# One deploy at a time; a new push waits for the running one
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smithorsmithy/personal-crm
  APP_URL: https://app.linkbook.site

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image (tag = commit SHA)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Runs after a successful build, or alone for a manual rollback
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.image_tag || github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy deploy scripts to the server
        run: rsync -rlt --delete --chmod=D750,F750 deploy/ server:/srv/crm/deploy/

      - name: Deploy on the server
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Short-lived login so the server can pull the image; removed right after
          printf '%s' "$REGISTRY_TOKEN" | ssh server "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" >/dev/null
          status=0
          ssh server "/srv/crm/deploy/deploy.sh '$TAG'" || status=$?
          ssh server "docker logout ghcr.io" >/dev/null || true
          exit $status

      - name: Check /health from outside
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 10 "$APP_URL/health" || true)
            echo "Attempt $attempt: $body"
            if printf '%s' "$body" | grep -q "\"version\":\"$TAG\""; then exit 0; fi
            sleep 5
          done
          echo "$APP_URL/health does not answer 200 with version $TAG"
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
