name: Deploy staging

# After every merge into main: builds the image (tag = commit SHA), pushes it
# to GHCR and deploys it to the test stand. Production gets the same image
# only by hand, with the "Deploy prod" workflow, and only a version whose
# deploy here was green: it checks the history of the "staging" environment
# (GitHub -> Deployments) that the job below writes.
on:
  push:
    branches: [main]

# One run at a time; a new push waits for the running one (on the server
# each environment also has its own lock)
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smithorsmithy/personal-crm

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image (tag = commit SHA)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the test stand
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Each run is recorded as a deployment to "staging": success or failure
    environment:
      name: staging
      url: https://test-app.linkbook.site
    permissions:
      contents: read
      packages: read
    env:
      APP_URL: https://test-app.linkbook.site
      TAG: ${{ github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy deploy scripts to the server
        run: rsync -rlt --delete --chmod=D750,F750 deploy/ server:/srv/crm/deploy/

      # The GHCR login goes on stdin: the script uses it only to pull the
      # image and keeps it nowhere after that
      - name: Deploy on the server
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" |
            ssh server "/srv/crm/deploy/deploy.sh staging '$TAG'"

      # /health is open on the test stand, the rest is behind a password
      - name: Check /health from outside
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 10 "$APP_URL/health" || true)
            echo "Attempt $attempt: $body"
            if printf '%s' "$body" | grep -q "\"version\":\"$TAG\""; then exit 0; fi
            sleep 5
          done
          echo "$APP_URL/health does not answer 200 with version $TAG"
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
